openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: https://tcokifjn4in7vbgzft2pqjdmvm0qeocz.lambda-url.eu-west-3.on.aws
    description: Generated server url
paths:
  /payment:
    post:
      tags:
        - payment-controller
      operationId: verifyPayment
      parameters:
        - name: apiKey
          in: query
          required: true
          schema:
            type: string
        - name: payerEmail
          in: query
          required: true
          schema:
            type: string
        - name: pspType
          in: query
          required: true
          schema:
            type: string
            enum:
              - ORANGE_MONEY
        - name: pspPaymentId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Payment'
  /ping:
    get:
      tags:
        - ping-controller
      operationId: ping
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
components:
  schemas:
    Application:
      type: object
      properties:
        name:
          type: string
        apiKey:
          type: string
    Payment:
      type: object
      properties:
        id:
          type: string
        pspPayment:
          $ref: '#/components/schemas/PspPayment'
        creationInstant:
          type: string
          format: date-time
        lastPspVerificationInstant:
          type: string
          format: date-time
        verificationAttemptNb:
          type: integer
          format: int32
        payer:
          $ref: '#/components/schemas/User'
        application:
          $ref: '#/components/schemas/Application'
        verificationStatus:
          type: string
    PspPayment:
      type: object
      properties:
        pspType:
          type: string
          enum:
            - ORANGE_MONEY
        id:
          type: string
        amount:
          type: integer
          format: int32
        creationInstant:
          type: string
          format: date-time
    User:
      type: object
      properties:
        email:
          type: string
